# NavalBattle: Run
#
# Plays the game on the RDCore platform, on Windows and on Linux. RDCore has no published release, so the job builds
# the platform from source (rubberduck-vba/RDCore at RDCORE_REF) with its own PlatformPublish.ps1, then:
#   1. `rdc run --unattended`, AI vs AI with a fixed seed, in the console: the game must play to "Game over" and exit 0.
#      The command line names both players, so it asks nobody anything and runs unattended; a game against a person
#      would fail here, as it should. On Windows the game is played in its form unless /console says otherwise, and a
#      form is UI that nobody answers when the run is unattended.
#   2. the same seed again: the two games must print the same output.
#   3. `rdc build`, for the runner's own OS, then the built program plays the same two games in the console, unattended.
#      With no executable (no .NET application host for the OS), the built program runs as `dotnet NavalBattle.dll`.

name: Run

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      rdcore-ref:
        description: The RDCore branch, tag or commit to build the platform from
        default: main

permissions:
  contents: read

env:
  RDCORE_REF: ${{ inputs.rdcore-ref || 'main' }}
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  run:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: demo

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rubberduck-vba/RDCore
          ref: ${{ env.RDCORE_REF }}
          path: rdcore

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0

      - name: Build the RDCore platform
        run: ./rdcore/PlatformPublish.ps1 -Silent -Configuration Release -PlatformRoot "$env:RUNNER_TEMP/platform"

      - name: Play AI vs AI, twice with the same seed
        run: |
          $rdc = Join-Path $env:RUNNER_TEMP 'platform/RDCore.CLI' ($IsWindows ? 'rdc.exe' : 'rdc')
          $games = foreach ($n in 1, 2) {
            $output = & $rdc run --unattended ./demo -- /console /seed 42 /player1 merciless /player2 fairplay 2>&1 | Out-String
            Write-Host $output
            if ($LASTEXITCODE -ne 0) { throw "Game $n exited with $LASTEXITCODE." }
            if ($output -notmatch 'Game over: grid \d wins\.') { throw "Game $n did not play to the end." }
            $output
          }
          if ($games[0] -ne $games[1]) { throw 'The same seed played two different games.' }

      - name: Build the program, and play AI vs AI with it
        run: |
          $rdc = Join-Path $env:RUNNER_TEMP 'platform/RDCore.CLI' ($IsWindows ? 'rdc.exe' : 'rdc')
          $out = Join-Path $env:RUNNER_TEMP 'NavalBattle'
          & $rdc build ./demo -c Release -o $out
          if ($LASTEXITCODE -ne 0) { throw "rdc build exited with $LASTEXITCODE." }
          $exe = Join-Path $out ($IsWindows ? 'NavalBattle.exe' : 'NavalBattle')
          $play = (Test-Path $exe) ? { & $exe @args } : { dotnet (Join-Path $out 'NavalBattle.dll') @args }
          $games = foreach ($n in 1, 2) {
            $output = & $play --unattended /console /seed 42 /player1 merciless /player2 fairplay 2>&1 | Out-String
            Write-Host $output
            if ($LASTEXITCODE -ne 0) { throw "Game $n exited with $LASTEXITCODE." }
            if ($output -notmatch 'Game over: grid \d wins\.') { throw "Game $n did not play to the end." }
            $output
          }
          if ($games[0] -ne $games[1]) { throw 'The same seed played two different games.' }
